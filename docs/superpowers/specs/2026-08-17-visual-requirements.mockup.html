<meta name="viewport" content="width=device-width, initial-scale=1">
<title>specboard mockup — visual requirements</title>
<style data-inlined="spec/_design.css — inlined so this mockup is self-contained">
/* Design system — 和 · hairline, unhurried, low-saturation.
 *
 * ONE file for the whole tool: the drafts link it relatively, and the generated board inlines
 * it. A design system kept in two places is a design system that drifts, and this product exists
 * to stop exactly that.
 *
 * Four rules the rest follows from:
 *
 *   TRADITIONAL DYES, NOT UI COLOURS. 藍 indigo, 弁柄 iron-oxide red, 苔 moss, 墨 ink, on 生成り
 *   unbleached paper. Every one sits under ~25% saturation, so the page reads as neutral until
 *   you actually look at it. No green-good / amber-warn: that convention is borrowed from every
 *   dashboard ever built and it makes this look like all of them.
 *
 *   VALUE CARRIES STATUS, HUE ONLY NAMES IT. An inverted, solid fill is the loudest mark on any
 *   screen, reserved for the one thing that most needs your attention there. Every state also
 *   carries a filled / half / hollow / dashed square, so status survives greyscale and low vision.
 *
 *   HAIRLINES, NEVER BOXES. 1px rules and negative space do the separating. No shadows, no
 *   radius, no fill that exists only to make an edge.
 *
 *   間 MA. Space is structure, not leftover padding. Everything sits on a 4px scale, and the
 *   large steps get used more freely than feels comfortable.
 *
 * Canvas is 1280px wide — the width every draft is authored and scaled against. */

:root {
  /* 墨 sumi — ink, and the ash scale under it.
     Measured, not eyeballed: the earlier tertiary and muted greys rendered chips and captions at
     2.2:1 against paper, where 4.5:1 is the floor for text this size. Restraint that cannot be
     read is not restraint. Every value below now passes AA on both --paper and --canvas, which
     compresses the scale — and a shorter grey scale is the more minimal answer anyway. */
  --sumi:#1c1b18; --ink:#1c1b18;
  --ink-2:#46443f; --dim:#46443f;
  --ink-3:#5f5d56; --mute:#5f5d56;
  --ink-4:#6e6b64;

  /* 生成り kinari — unbleached paper */
  --paper:#fdfcf9;  --card:#fdfcf9;
  --canvas:#f4f1ea; --bg:#f4f1ea;
  --wash:#eae6dc;   --sunk:#eae6dc; --dim-bg:#eae6dc;

  --hair:#e2ddd1;   --line:#e2ddd1;
  --hair-2:#cdc7b8; --line2:#cdc7b8;
  --line3:#a8a59c;

  /* 藍 ai — indigo. Reserved: no longer a status (the guess/gate "your turn" state it once named was
     removed, the human, 2026-08-17); still tints on hover for many-to-many coverage linking, and
     kept for a future `Changed` drift state. The only colour permitted to fill a shape solid. */
  --ai:#2f4a63; --acc:#2f4a63;
  --ai-tint:#e6eaee; --acc-bg:#e6eaee;
  --ai-line:#b9c4ce; --acc-line:#b9c4ce;

  /* 弁柄 bengara — iron oxide. A re-look: something you already settled has moved. */
  --bengara:#8d4a38; --bad:#8d4a38; --warn:#8d4a38;
  --bengara-tint:#f2e8e4; --bad-bg:#f2e8e4; --warn-bg:#f2e8e4;
  --bengara-line:#d8c0b6; --bad-line:#d8c0b6; --warn-line:#d8c0b6;

  /* 苔 koke — moss. Settled, approved, passing. */
  --koke:#4d5c37; --ok:#4d5c37;
  --koke-tint:#eaece1; --ok-bg:#eaece1;
  --koke-line:#bcc4a8; --ok-line:#bcc4a8;

  /* 山吹 yamabuki — gold. In flight: a job running, a step in progress. Nothing is wrong and
     nothing is settled, which is a third thing and used to look identical to "your turn". */
  --yamabuki:#8a6412;
  --yamabuki-tint:#f6eeda;
  --yamabuki-line:#dfc98c;

  /* WHY FOUR AND NOT ONE. Every interactive thing used to be indigo — primary buttons, the
     active segment, the checkbox, the focus ring, AND the old "your turn" chip — so colour told you
     something was interactive and never which thing it was. Now hue means one thing each:
     苔 moss = approved · 弁柄 iron = sent back or moved · 山吹 gold = running ·
     墨 ink = the neutral primary action · 藍 indigo = reserved (no status of its own right now).
     An action is coloured by the STATE IT PRODUCES, so "Looks right" is the green of approved. */

  /* 間 ma — 4px scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;

  /* radius — softness in proportion to how much you TOUCH the thing.
     Controls you press get it most; surfaces get less; anything meeting the viewport edge or
     separated by a full-bleed rule gets none, because a rounded corner on a full-width bar just
     looks like a mistake. */
  --r-sm:4px;   /* chips, checks, small marks */
  --r:6px;      /* buttons, inputs, segmented controls */
  --r-md:10px;  /* cards, cells, panels */
  --r-lg:14px;  /* sheets and modals */
  --rc:10px;    /* legacy alias used by the drafts */

  /* elevation — ONLY for things genuinely floating above the page: modals, popovers, a sticky
     header with content running under it. Never on in-flow cards; a page where every card floats
     is a page with no hierarchy at all. Warm-tinted, because a neutral black shadow on washi
     goes grey and dirty. */
  --sh-sm:0 1px 2px rgba(28,27,24,.05);
  --sh-md:0 2px 8px rgba(28,27,24,.07), 0 1px 2px rgba(28,27,24,.05);
  --sh-lg:0 14px 36px rgba(28,27,24,.14), 0 2px 6px rgba(28,27,24,.06);

  /* type — one family, six sizes, two weights */
  --sans:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 10px was too small for the tracked uppercase labels that carry the column meanings */
  --t-micro:11px; --t-xs:11.5px; --t-sm:12.5px; --t-md:13px; --t-lg:15px; --t-xl:19px;
}

* { box-sizing:border-box; }
/* The hidden attribute only carries a UA display:none, which ANY author display beats. Half this
   file sets display on things you would want to hide — .btn and .seg and .chip are inline-flex,
   .card > header is flex — so `el.hidden = true` silently did nothing to most of them. The board
   already carried a one-off .dt[hidden] patch after every detail view rendered at once, stacked;
   that was this bug, and it belongs here rather than being rediscovered per component. */
[hidden] { display:none !important; }
body {
  margin:0; width:1280px; background:var(--canvas); color:var(--ink);
  font:400 var(--t-md)/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3 { margin:0; font-weight:400; letter-spacing:-.02em; }
h1 { font-size:var(--t-xl); } h2 { font-size:var(--t-lg); } h3 { font-size:var(--t-md); }
code, .mono { font-family:var(--mono); font-size:.88em; letter-spacing:-.01em; }
b, strong { font-weight:500; }
del { color:var(--bengara); text-decoration:line-through; }
ins { color:var(--koke); text-decoration:none; }

/* the one label style — small, tracked wide, upper */
.lbl { font-size:var(--t-micro); letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; }
.muted { color:var(--ink-4); } .dim { color:var(--ink-2); }
.spacer, .grow { flex:1; }
.sep { height:1px; background:var(--hair); }

/* chrome ------------------------------------------------------------------
   One rule separates chrome from page. No fill change, no shadow. */
.top { display:flex; align-items:center; gap:var(--s4); padding:var(--s4) var(--s6);
  border-bottom:1px solid var(--hair); background:var(--paper); }
.brand { display:flex; align-items:center; gap:var(--s2); font-size:var(--t-lg); letter-spacing:-.02em; }
.logo { width:13px; height:13px; background:var(--ai); }
.crumb { font-size:var(--t-sm); color:var(--ink-4); }
.page { padding:var(--s6) var(--s6) var(--s8); }

/* controls ---------------------------------------------------------------- */
.btn { display:inline-flex; align-items:center; gap:var(--s2); border:1px solid var(--hair-2);
  background:var(--paper); color:var(--ink); border-radius:var(--r); padding:var(--s2) var(--s4);
  font:400 var(--t-sm)/1.3 var(--sans); cursor:pointer; text-decoration:none;
  transition:border-color .12s, background .12s, color .12s, box-shadow .12s; }
.btn:hover { border-color:var(--ink); }
/* neutral primary — the default "do the main thing" */
.btn.pri { background:var(--ink); border-color:var(--ink); color:var(--paper); }
.btn.pri:hover { background:var(--ink-2); border-color:var(--ink-2); }
/* affirmative — wears the colour of the state it creates */
.btn.ok { background:var(--koke); border-color:var(--koke); color:var(--paper); }
.btn.ok:hover { background:#3f4c2c; border-color:#3f4c2c; }
/* send back — outlined, not filled: it is not the destructive-looking option, it is the honest one */
.btn.no { border-color:var(--bengara-line); color:var(--bengara); background:var(--bengara-tint); }
.btn.no:hover { border-color:var(--bengara); }
/* attention — used where the app is asking YOU for something */
.btn.turn { background:var(--ai); border-color:var(--ai); color:var(--paper); }
.btn.turn:hover { background:#253c51; border-color:#253c51; }
.btn.sm { padding:5px var(--s3); font-size:var(--t-xs); }
.btn.gh { border-color:transparent; background:transparent; color:var(--ink-3); }
.btn.gh:hover { border-color:var(--hair-2); color:var(--ink); }
.btn[disabled] { color:var(--ink-4); border-color:var(--hair); cursor:default; }

.seg { display:inline-flex; border:1px solid var(--hair-2); border-radius:var(--r);
  overflow:hidden; }
.seg span, .seg button { padding:5px var(--s3); font:400 var(--t-sm)/1.4 var(--sans);
  color:var(--ink-3); border:0; border-right:1px solid var(--hair-2); background:transparent;
  cursor:pointer; text-transform:none; letter-spacing:0; }
.seg span:last-child, .seg button:last-child { border-right:0; }
.seg .on, .seg button.on { background:var(--ai); color:var(--paper); }

/* A full border, not an underline. An underline-only input in a toolbar reads as a caption until
   you happen to click it — the box is what says "you can type here". */
.input { width:100%; border:1px solid var(--hair-2); background:var(--paper);
  padding:var(--s2) var(--s3); font:400 var(--t-sm)/1.4 var(--sans); color:var(--ink);
  border-radius:var(--r); transition:border-color .12s, box-shadow .12s; }
.input:focus { outline:0; border-color:var(--ai); box-shadow:0 0 0 3px var(--ai-tint); }
.input.ph { color:var(--ink-4); }
.input::placeholder { color:var(--ink-4); }
.radio { width:12px; height:12px; border:1px solid var(--hair-2); border-radius:50%; flex:none; }
.radio.on { border:4px solid var(--ai); }
.check { width:12px; height:12px; border:1px solid var(--hair-2); flex:none; border-radius:3px; }
.check.on { background:var(--ai); border-color:var(--ai); }

/* status ------------------------------------------------------------------
   Read by weight of ink first, hue second. */
.chip { display:inline-flex; align-items:center; gap:6px; font-size:var(--t-xs); line-height:1.4;
  padding:3px var(--s2); background:var(--wash); color:var(--ink-3);
  white-space:nowrap; text-transform:none; letter-spacing:0; border-radius:var(--r-sm); }
/* ALL status chips are tints. An inverted chip was reserved for "your turn", which reads well
   when one row in twenty needs you and falls apart the moment most of them do — and most of them
   needing you is the normal state of a young board. A dozen solid blocks compete, so none of
   them is emphasis any more. Inversion is now spent on exactly ONE element per screen: the
   summary count in the header. Status is told by hue and by the mark, quietly, in place. */
.chip.ok    { background:var(--koke-tint); color:var(--koke);
              box-shadow:inset 0 0 0 1px var(--koke-line); }
.chip.rev   { background:var(--ai-tint); color:var(--ai);
              box-shadow:inset 0 0 0 1px var(--ai-line); }
/* .fail reuses the same bengara tokens as .stale — a requirement's "Failed" (board R4) and an open
   conflict's "re-look" are different states that happen to share one hue (something needs a second
   look), named separately so neither reads as the other. */
.chip.stale, .chip.fail { background:var(--bengara-tint); color:var(--bengara);
              box-shadow:inset 0 0 0 1px var(--bengara-line); }
/* the deliberate exception, for the one place a count must carry the whole page */
.chip.solid { background:var(--ai); color:var(--paper); box-shadow:none; }
.chip.bad   { background:var(--bengara); color:var(--paper); }
.chip.gone  { background:transparent; color:var(--ink-4); box-shadow:inset 0 0 0 1px var(--hair); }
/* .wait reuses the same yamabuki tokens as .run — a requirement's "Not reached" (board R4) is a
   third thing, like a job in flight: nothing is wrong and nothing is settled, named separately so
   a not-reached requirement is never mistaken for an actually-running job. */
.chip.run, .chip.wait { background:var(--yamabuki-tint); color:var(--yamabuki);
              box-shadow:inset 0 0 0 1px var(--yamabuki-line); }

/* the mark: a 6px square whose FILL carries the state, so status survives greyscale,
   low vision, and a black-and-white print */
.dot, .mark { width:6px; height:6px; flex:none; background:currentColor; }
.mark.o { background:transparent; box-shadow:inset 0 0 0 1px currentColor; }
.mark.h { background:linear-gradient(135deg,currentColor 50%,transparent 50%);
  box-shadow:inset 0 0 0 1px currentColor; }
.mark.n { height:1px; }

/* behavior ----------------------------------------------------------------
   The Given/When/Then shape a requirement may LEAD with (2026-08-18): structural, not a status —
   no hue, no chip, no fill (hairlines, never boxes: one bottom rule separates shape from prose).
   Labels reuse the one label style (--t-micro tracked upper in --ink-3 — measured at the top of
   this file, AA on both --paper and --canvas); the values carry the requirement's own ink at the
   body size, so the block sits under the title and above the prose without shouting. */
.behavior { display:grid; grid-template-columns:max-content 1fr; gap:var(--s1) var(--s3);
  align-items:baseline; margin:0 0 var(--s3); padding:0 0 var(--s3);
  border-bottom:1px solid var(--hair); }
.brow { display:contents; }
.blab { font-size:var(--t-micro); letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; }
.btxt { color:var(--ink); font-size:var(--t-md); line-height:1.55; }

/* surfaces ---------------------------------------------------------------- */
.card { background:var(--paper); border:1px solid var(--hair); border-radius:var(--r-md);
  overflow:hidden; }
.card > header { display:flex; align-items:center; gap:var(--s3); padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--hair); }
.pad { padding:var(--s4); }
.well { background:var(--wash); }

.stat { display:inline-flex; align-items:baseline; gap:6px; padding:var(--s2) 0;
  font-size:var(--t-sm); color:var(--ink-3); }
.stat + .stat { margin-left:var(--s5); }
.stat b { font-weight:400; font-size:var(--t-lg); color:var(--ink); letter-spacing:-.03em; }
/* the one number allowed to shout, and it shouts by inverting */
.stat.hot { background:var(--ai); color:var(--paper); padding:var(--s2) var(--s3);
  border-radius:var(--r); }

/* keyboard hints, and the "or" that separates two paths in a decision bar */
.kbd { font-family:var(--mono); font-size:var(--t-micro); color:var(--ink-4);
  border:1px solid var(--hair); border-radius:3px; padding:1px 4px; margin-left:7px; }
.btn .kbd { color:inherit; border-color:currentColor; opacity:.5; }
.gor { font-size:var(--t-sm); color:var(--ink-4); flex:none; }

/* the only true elevation in the system — things that actually float over the page */
.sheet, .modal, .popover { border-radius:var(--r-lg); box-shadow:var(--sh-lg);
  background:var(--paper); border:1px solid var(--hair-2); }
.stat.hot b { color:var(--paper); }

</style>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:var(--canvas); color:var(--ink); font-family:var(--sans); font-size:var(--t-md); line-height:1.55; }
  a { color:inherit; }
  button { font:inherit; cursor:pointer; }
  .mono { font-family:var(--mono); }

  /* ============ shared control kit (aligned) ============ */
  .btn { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line2); background:var(--paper); border-radius:var(--r); font-size:var(--t-sm); padding:0 14px; height:34px; color:var(--dim); }
  .btn:hover { border-color:var(--line3); color:var(--ink); }
  .btn.dark { border:0; background:var(--sumi); color:var(--paper); }
  .btn.dark:hover { background:#000; color:var(--paper); }
  .seg { display:inline-flex; border:1px solid var(--line2); border-radius:var(--r); overflow:hidden; background:var(--paper); height:34px; }
  .seg button { border:0; background:transparent; font-size:var(--t-sm); padding:0 15px; color:var(--mute); }
  .seg button.on { background:var(--wash); color:var(--ink); font-weight:500; }
  .seg button:not(.on):hover { color:var(--dim); }
  .switch { display:inline-flex; align-items:center; gap:9px; border:1px solid var(--line2); background:var(--paper); border-radius:var(--r); height:34px; padding:0 12px 0 13px; font-size:var(--t-sm); color:var(--dim); }
  .switch .sw { width:32px; height:18px; border-radius:99px; background:var(--line2); position:relative; transition:background .18s; flex:none; }
  .switch .sw::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--paper); transition:left .18s; box-shadow:var(--sh-sm); }
  .switch.on { color:var(--ink); }
  .switch.on .sw { background:var(--koke); }
  .switch.on .sw::after { left:16px; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:var(--t-xs); border-radius:99px; padding:2px 10px; border:1px solid var(--line2); color:var(--dim); background:var(--paper); }
  .rid { font-family:var(--mono); font-size:var(--t-xs); color:var(--mute); border:1px solid var(--hair); border-radius:var(--r-sm); padding:1px 6px; }
  .lbl { font-family:var(--mono); font-size:var(--t-micro); letter-spacing:.13em; text-transform:uppercase; color:var(--mute); margin:0 0 var(--s3); }

  /* state marks */
  .st-ok   { color:var(--ok); } .st-bad { color:var(--bad); } .st-nr { color:var(--yamabuki); } .st-un { color:var(--mute); } .st-turn { color:var(--ai); }
  .tag { display:inline-flex; align-items:center; gap:5px; font-size:var(--t-xs); border-radius:99px; padding:2px 10px; border:1px solid; }
  .tag.ok   { color:var(--ok); background:var(--ok-bg); border-color:var(--ok-line); }
  .tag.bad  { color:var(--bad); background:var(--bad-bg); border-color:var(--bad-line); }
  .tag.nr   { color:var(--yamabuki); background:var(--yamabuki-tint); border-color:var(--yamabuki-line); }
  .tag.un   { color:var(--mute); background:var(--paper); border-color:var(--line2); }
  .tag.turn { color:var(--ai); background:var(--ai-tint); border-color:var(--ai-line); }
  .tag.changed { color:var(--ai); background:var(--ai-tint); border-color:var(--ai-line); }
  .st-changed { color:var(--ai); }

  /* ============ header ============ */
  .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:var(--s3); padding:12px var(--s6); background:var(--paper); border-bottom:1px solid var(--hair); min-height:60px; }
  .brand { display:flex; align-items:center; gap:11px; }
  .brand .glyph { width:26px; height:26px; border-radius:7px; background:var(--sumi); }
  .brand .nm { font-weight:600; font-size:var(--t-lg); }
  .brand .sub { font-size:var(--t-xs); color:var(--mute); }
  .mockflag { font-family:var(--mono); font-size:var(--t-micro); letter-spacing:.08em; text-transform:uppercase; color:var(--yamabuki); background:var(--yamabuki-tint); border:1px solid var(--yamabuki-line); border-radius:var(--r-sm); padding:2px 8px; }
  .grow { flex:1; }
  .search { display:flex; align-items:center; gap:8px; border:1px solid var(--line2); background:var(--paper); border-radius:var(--r); height:34px; padding:0 12px; min-width:280px; color:var(--mute); }
  .search input { border:0; outline:none; background:none; font:inherit; font-size:var(--t-sm); color:var(--ink); flex:1; }
  .search:focus-within { border-color:var(--line3); }
  .badge-n { font-size:var(--t-micro); background:var(--wash); border-radius:99px; padding:0 6px; color:var(--dim); margin-left:2px; }

  /* detail top bar */
  .dname { display:flex; flex-direction:column; gap:1px; }
  .dname .t { font-weight:600; font-size:var(--t-lg); }
  .dname .s { font-family:var(--mono); font-size:var(--t-micro); color:var(--mute); }

  /* ============ layout ============ */
  .wrap { max-width:1180px; margin:0 auto; padding:var(--s5) var(--s6) var(--s8); }

  /* queue banner */
  .queue { display:flex; align-items:center; gap:14px; border-radius:var(--r-md); padding:14px var(--s5); margin-bottom:var(--s5); font-size:var(--t-sm); }
  .queue.clear { background:var(--koke-tint); border:1px solid var(--koke-line); color:var(--ink-2); }
  .queue.attn  { background:var(--yamabuki-tint); border:1px solid var(--yamabuki-line); color:var(--ink-2); }
  .queue .qk { font-family:var(--mono); font-size:var(--t-xs); border-radius:var(--r-sm); padding:3px 10px; white-space:nowrap; }
  .queue.clear .qk { background:#fff; color:var(--koke); border:1px solid var(--koke-line); }
  .queue.attn .qk  { background:#fff; color:var(--yamabuki); border:1px solid var(--yamabuki-line); }
  .queue.attn a { color:var(--yamabuki); font-weight:500; }
  .queue a { color:var(--ai); font-weight:500; }

  /* area */
  .area { margin-bottom:var(--s6); }
  .area .ahead { display:flex; align-items:baseline; gap:10px; margin-bottom:var(--s4); }
  .area .ahead h2 { font-size:var(--t-lg); font-weight:600; margin:0; }
  .area .ahead .ct { font-size:var(--t-xs); color:var(--mute); }

  /* screen card */

  .cmeta2 { min-width:0; flex:1; }

  .cchip { font-family:var(--mono); font-size:9px; color:var(--ai); border:1px solid var(--ai-line);

  .cactions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

    padding:10px 14px; margin-top:var(--s3); }

  .cprompt { border:1px solid var(--line2); border-radius:var(--r-md); background:var(--paper); overflow:hidden; }
  .cprompt .ph2 { display:flex; align-items:center; gap:var(--s2); padding:7px 12px; border-bottom:1px solid var(--line2);
    background:var(--wash); font-family:var(--mono); font-size:10px; color:var(--dim); }
  .cprompt .ph2 .btn { margin-left:auto; }

  .chonest { border:1px solid var(--line2); border-radius:var(--r-md); background:var(--wash); padding:10px 14px;
    font-size:var(--t-xs); color:var(--dim); line-height:1.6; }
  @media (max-width:1000px){ .cwrap, .cout { grid-template-columns:1fr; } }
  .flowcard { background:var(--paper); border:1px solid var(--hair); border-radius:var(--r-md); box-shadow:var(--sh-sm); padding:var(--s4); }
  .fhead { display:flex; justify-content:space-between; align-items:baseline; gap:var(--s3); margin-bottom:var(--s4); flex-wrap:wrap; }
  .fhead h2 { font-size:var(--t-lg); font-weight:600; margin:0; }
  .fmeta { font-size:var(--t-xs); color:var(--mute); font-family:var(--mono); }
  .fmeta a { color:var(--dim); }

  .pstat { font-size:var(--t-xs); color:var(--mute); margin-top:var(--s2); text-align:center; }
  .stopov { position:absolute; left:8px; right:8px; bottom:8px; border-radius:var(--r); padding:8px 12px; font-size:var(--t-sm); font-weight:500; opacity:0; transition:opacity .3s; pointer-events:none; display:flex; align-items:center; gap:8px; z-index:7; }

  /* chapter bar = a row of video-chapter thumbnails; state lives on the thumb ring (human 2026-08-21) */

  /* ============ Tsumiki mini-app (real app palette, as the recording shows it) ============ */
  .stage { background:#f4f5f8; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,system-ui,sans-serif; font-size:13px; color:#1e2330; min-height:230px; }

  @keyframes blink { 50% { opacity:0; } }
  .stage .go { font-weight:600; font-size:12.5px; padding:0 14px; border:0; border-radius:8px; background:#4f46e5; color:#fff; }
  .stage .go.dis { opacity:.4; }

<body>

<script>
/* =================================================================== */
/* DATA — Tsumiki demo project: 4 screens, 2 areas, unit + flow tests   */
/* =================================================================== */

/* -- requirements per screen (behavior rows + prose + computed state) -- */
const SCREENS = {
  'task-list': {
    area:'Tasks', name:'Task list', route:'/todo.html', cover:'coverTaskList',
    reqs:[
      { id:'R1', title:'Adding a task puts it in the list', state:'ok', primary:'F2', scene:'sceneR1',
        given:'the list is seeded', sub:'input empty → Add disabled', when:'type “Water the plants”, press Add',
        then:'a new row at the bottom, unchecked, meta reads “added just now”',
        prose:'Typing a task and pressing Add (or Enter) shows it as a new row at the bottom of the list, unchecked, carrying exactly the text that was typed. An empty input adds nothing — the Add button is disabled until there is text.' },
      { id:'R2', title:'A task can be edited in place, and the edit is stamped', state:'ok', primary:'F2', scene:'sceneR2',
        given:'a task exists', sub:'meta reads “added”', when:'double-click the title, type, press Enter',
        then:'the same row shows the new text; meta flips to “edited just now”',
        prose:'Double-clicking a task’s title (or its edit icon) makes it editable; Enter saves the new text in the same row, Escape cancels. Saving a real change records an “edited” time, replacing the “added” one.' },
      { id:'R3', title:'A task with sub-tasks is a container with a derived progress ring', state:'ok', primary:'U1', also:['F1'], scene:'sceneR3',
        given:'a container task', sub:'ring reads 1 of 2 · no checkbox', when:'add a sub-task',
        then:'the ring reads 1 of 3 by itself — the parent still has no checkbox',
        prose:'Sub-tasks live inside a task. A task that has them is a container: it shows a progress ring counting its sub-tasks (2 of 3) in place of its own checkbox, so it can never be completed by a stray click — only its sub-tasks can be. Adding a sub-task moves the ring by itself.' },
      { id:'R4', title:'Completion rolls up, both directions', state:'ok', primary:'F1', scene:'sceneR4',
        given:'a container', sub:'2 of 3 done · one open sub-task',
        // beats (spec 2026-08-20): one Given, then When→Then pairs — each an assertable outcome
        beats:[
          { when:'tick the last open sub-task', then:'the container completes by itself — ring reads 3 of 3, its row struck' },
          { when:'untick that same sub-task', then:'the container reopens by itself — the done-state is derived, both directions' },
        ],
        prose:'Completing the last open sub-task completes the container by itself; reopening any sub-task reopens the container. The container’s done-state is purely derived from its children — nobody ticks a container by hand.' },
      { id:'R5', title:'“To do” counts remaining leaves only', state:'bad', primary:'F1', scene:'sceneR5',
        given:'header reads 3 to do', sub:'a container holds 2 open sub-tasks', when:'complete the container’s two sub-tasks',
        then:'the count drops by exactly two, to 1 — the container is never a unit of work',
        beat:'expected “1 to do”, got “2” — the container was counted as a unit of work',
        prose:'The header count is the real amount of work left: open sub-tasks, plus open tasks that have no sub-tasks. A container is scaffolding — it is never counted as a unit of work itself, and completing one drops the count by its open-leaf count, not by one. The single most drift-prone rule here — the one the red demo deliberately breaks.' },
      { id:'R6', title:'Smart views filter correctly, and the sidebar counts agree', state:'ok', primary:'F2', scene:'sceneR6',
        given:'All shows 4 tasks', sub:'badges All 4 · Active 3 · Today 1 · Done 1', when:'click the Today view',
        then:'only not-done tasks due on/before today remain — and the badge equals the rows shown',
        prose:'All shows every task; Active hides done tasks; Today shows only not-done tasks due on or before today; Completed shows only done tasks. Each view’s sidebar badge equals the number of task rows that view actually shows.' },
      { id:'R7', title:'A due date derives an overdue or today chip', state:'ok', primary:'U2', scene:'sceneR7',
        given:'the clock is frozen via ?now=', sub:'seeded tasks span past · today · later', when:'read the visible date chips',
        then:'past-due wears red “overdue”, due-today wears “today”, later shows its date, done wears none',
        prose:'A not-done task due before today wears the red “overdue” chip; a task due today wears the “today” chip; a task due later shows its date; a done task wears no date chip.' },
      { id:'R8', title:'Everything survives a reload', state:'nr', primary:'F1', scene:null,
        given:'edits, completions and stamps made above', sub:'', when:'reload the page',
        then:'every task, state and timestamp comes back — nothing lived only on screen',
        prose:'Tasks, sub-tasks, done-states, edited titles, due dates, order, and every created / edited / completed timestamp all come back after the page reloads — nothing lived only on screen.' },
    ],
    tests:[
      { id:'F1', kind:'flow', name:'Roll-up round trip', dur:'1m 04s', run:'ea389a6', result:'fail', covers:['R3','R4','R5','R8'],
        chapters:[
          { name:'fixture', comp:'frozen clock · storage cleared', screen:'Task list', kind:'seed' },
          { name:'add a sub-task', comp:'container', screen:'Task list', reqs:['R3'], scene:'sceneR3' },
          { name:'roll up', comp:'container · sub-tasks', screen:'Task list', reqs:['R4'], scene:'sceneR4' },
          { name:'count remaining', comp:'header count', screen:'Task list', reqs:['R5'], scene:'sceneR5', fail:true },
          { name:'reload', comp:'whole screen', screen:'Task list', reqs:['R8'], kind:'nr' },
        ]},
      { id:'F2', kind:'flow', name:'First run — add, edit, filter', dur:'52s', run:'ea389a6', result:'pass', covers:['R1','R2','R6'],
        chapters:[
          { name:'fixture', comp:'frozen clock · storage cleared', screen:'Task list', kind:'seed' },
          { name:'add a task', comp:'task list · header', screen:'Task list', reqs:['R1'], scene:'sceneR1' },
          { name:'edit in place', comp:'task row', screen:'Task list', reqs:['R2'], scene:'sceneR2' },
          { name:'filter to Today', comp:'smart views', screen:'Task list', reqs:['R6'], scene:'sceneR6' },
        ]},
      { id:'U1', kind:'unit', name:'The progress ring counts sub-tasks', dur:'8s', run:'ea389a6', result:'pass', covers:['R3'], scene:'sceneR3' },
      { id:'U2', kind:'unit', name:'Date chips read the frozen clock', dur:'11s', run:'ea389a6', result:'pass', covers:['R7'], scene:'sceneR7' },
    ],
  },
  'task-detail': {
    area:'Tasks', name:'Task detail', route:'/todo.html?task=', cover:'coverTaskDetail',
    reqs:[
      { id:'D1', title:'Sub-tasks are checkable from the detail view', state:'ok', primary:'F3', scene:'sceneDetailComplete',
        given:'a container opened on its own page', sub:'breadcrumb back to the list', when:'tick a sub-task here',
        then:'the sub-task completes and the detail ring advances',
        prose:'Opening a task shows its own page: a breadcrumb back to the list, the title, and each sub-task with its own checkbox. Ticking one here completes it exactly as it would in the list.' },
      { id:'D2', title:'A change here reflects in the list on return', state:'ok', primary:'F3', scene:'sceneListReflects',
        given:'a sub-task completed in the detail', sub:'cross-screen — starts on the list', when:'navigate back to the list',
        then:'the task’s ring on the list shows the completed sub-task',
        prose:'A completion made in the detail view is the same state as the list — returning to the list shows the task’s ring advanced. This is a cross-screen requirement: the flow that proves it starts on the Task list, opens the detail, and returns.' },
      { id:'D3', title:'An unknown task id shows an empty state, not an error', state:'un', primary:null, scene:null,
        given:'a task id that does not exist', sub:'', when:'open the detail for it',
        then:'a calm empty state with a link back — never a stack trace or a blank page',
        prose:'Opening a detail for a task that was deleted or never existed shows an empty state with a way back to the list. It must never throw or render blank.' },
    ],
    tests:[
      { id:'F3', kind:'flow', name:'Complete from the detail view', dur:'38s', run:'ea389a6', result:'pass', covers:['D1','D2'], startsOn:'Task list',
        chapters:[
          { name:'open the task', comp:'a container row', screen:'Task list', scene:'sceneOpenDetail' },
          { name:'complete a sub-task', comp:'detail · sub-tasks', screen:'Task detail', reqs:['D1'], scene:'sceneDetailComplete' },
          { name:'return to the list', comp:'the list reflects it', screen:'Task list', reqs:['D2'], scene:'sceneListReflects' },
        ]},
    ],
  },
  'settings': {
    area:'Account', name:'Settings', route:'/settings.html', cover:'coverSettings',
    reqs:[
      { id:'G1', title:'Dark mode persists across a reload', state:'ok', primary:'U3', scene:'coverSettings',
        given:'dark mode is on', sub:'', when:'reload the page',
        then:'the app comes back in dark mode',
        prose:'Toggling dark mode is remembered — after a reload the app is still in the mode you left it.' },
      { id:'G2', title:'Clear all data asks to confirm first', state:'un', primary:null, scene:null,
        given:'the “clear all data” button', sub:'', when:'click it',
        then:'a confirm step appears before anything is deleted',
        prose:'Destructive actions confirm first. Clicking “clear all data” opens a confirmation; nothing is deleted until it is accepted.' },
    ],
    tests:[
      { id:'U3', kind:'unit', name:'Dark mode survives a reload', dur:'9s', run:'ea389a6', result:'pass', covers:['G1'], scene:'coverSettings' },
    ],
  },
  'sign-in': {
    area:'Account', name:'Sign in', route:'/signin.html', cover:'coverSignin',
    reqs:[
      { id:'S1', title:'Sign in stays disabled until the email is valid', state:'un', primary:null, scene:null,
        given:'the sign-in form', sub:'', when:'the email is not a valid address',
        then:'the Sign in button stays disabled',
        prose:'The Sign in button only enables once the email field holds a valid-looking address.' },
      { id:'S2', title:'A wrong password shows one inline message', state:'un', primary:null, scene:null,
        given:'a wrong password', sub:'', when:'submit',
        then:'one inline message shows, and the page does not reload',
        prose:'A failed sign-in shows a single inline error next to the field — no full-page reload, no stacked messages.' },
      { id:'S3', title:'“Remember me” keeps the session after a reload', state:'un', primary:null, scene:null,
        given:'“remember me” checked', sub:'', when:'reload after signing in',
        then:'the session persists',
        prose:'With “remember me” checked, a reload keeps the user signed in.' },
    ],
    tests:[],
  },
};
const AREAS = ['Tasks','Account'];
const SCREEN_ORDER = ['task-list','task-detail','settings','sign-in'];

/* formatted requirement text (point 4) — bullets, bold, and colour for the load-bearing rule */
const RICH = {
  R1:`<p>Typing a task and pressing <b>Add</b> (or Enter) appends it to the list.</p>
      <ul><li>Lands as a <b>new row at the bottom</b>, unchecked, with exactly the typed text</li>
      <li>Its meta reads <b>“added just now”</b></li>
      <li><span class="cbad">An empty input adds nothing</span> — Add stays disabled until there’s text</li></ul>`,
  R2:`<p><b>Double-clicking</b> a title (or the edit icon) makes it editable.</p>
      <ul><li><b>Enter</b> saves in the same row · <b>Escape</b> cancels</li>
      <li>A real change stamps <b>“edited just now”</b>, replacing “added”</li></ul>`,
  R3:`<p>A task with sub-tasks becomes a <b>container</b> — it shows a <b>progress ring</b> (e.g. 2 of 3) in place of its own checkbox.</p>
      <ul><li><span class="cbad">No checkbox on the parent</span> — it can’t be completed by a stray click</li>
      <li>Adding a sub-task <b>moves the ring by itself</b></li></ul>`,
  R4:`<p>The container’s done-state is <b>purely derived from its children</b>.</p>
      <ul><li>Completing the <b>last open sub-task</b> completes the container</li>
      <li>Reopening any sub-task <b>reopens</b> it</li>
      <li>Nobody ticks a container by hand</li></ul>`,
  R5:`<p>The header count is the <b>real work left</b>: open sub-tasks, plus open tasks with no sub-tasks.</p>
      <ul><li>A container is <b>scaffolding</b> — <span class="cbad">never counted as a unit itself</span></li>
      <li>Completing a container drops the count by its <b>open-leaf count</b>, not by one</li></ul>
      <p class="cmute">The single most drift-prone rule — the one the red demo breaks.</p>`,
  R6:`<table class="rtab"><tr><td><b>All</b></td><td>every task</td></tr>
      <tr><td><b>Active</b></td><td>hides done</td></tr>
      <tr><td><b>Today</b></td><td>not-done, due on/before today</td></tr>
      <tr><td><b>Completed</b></td><td>done only</td></tr></table>
      <p>Each view’s <b>sidebar badge equals the rows it shows</b>.</p>`,
  R7:`<p>Date chips derive from the <b>frozen clock</b> (<span class="mono">?now=</span>):</p>
      <ul><li>Due before today → <span class="cbad">overdue</span></li>
      <li>Due today → <span class="cwarn">today</span></li>
      <li>Due later → its date · done → <b>no chip</b></li></ul>`,
  R8:`<p><b>Everything persists</b> across a reload — nothing lives only on screen.</p>
      <ul><li>Tasks, sub-tasks, done-states, edited titles, due dates, order</li>
      <li>Every created / edited / completed <b>timestamp</b></li></ul>`,
};
SCREENS['task-list'].reqs.forEach(r => { if (RICH[r.id]) r.rich = RICH[r.id]; });
// demo the "Changed" (drift) state: R2 was proven, but its wording was edited since
SCREENS['task-list'].reqs.find(r => r.id === 'R2').state = 'changed';

const MK = { ok:['✓','Passed'], bad:['✗','Failed'], nr:['◌','Not reached'], un:['○','Untested'], changed:['✎','Changed'] };
const STATE_COL = { ok:'var(--ok)', bad:'var(--bad)', nr:'var(--yamabuki)', un:'var(--mute)', changed:'var(--ai)' };

/* global UI state */
let autoPlay = true;
let stopScene = null;
let searchQ = '';

/* helpers */
function scr(id){ return SCREENS[id]; }
function reqOf(id, rid){ return scr(id).reqs.find(r => r.id === rid); }
function testOf(id, tid){ return scr(id).tests.find(t => t.id === tid); }
function stateOf(r, s){ return r.state; }
function provenCount(s){ return s.reqs.filter(r => r.state === 'ok').length; }
function kindCounts(s){ return { unit:s.tests.filter(t=>t.kind==='unit').length, flow:s.tests.filter(t=>t.kind==='flow').length }; }
function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(t){ if(!searchQ) return esc(t); const i = t.toLowerCase().indexOf(searchQ.toLowerCase()); if(i<0) return esc(t); return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+searchQ.length))+'</mark>'+esc(t.slice(i+searchQ.length)); }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function tagHtml(state){ const [mk,tx]=MK[state]; return `<span class="tag ${state}">${mk} ${tx}</span>`; }

/* =================================================================== */
/* TEST-AUTHORING PROMPTS — the board hands you an instruction for Claude */
/* =================================================================== */
let modalState = null;
function openPromptModal(cfg){
  modalState = Object.assign({ action:'add', kind:'unit', reqIds:[], screenId:null, testId:null }, cfg);
  if (modalState.action==='add' && modalState.kind==='flow' && !modalState.reqIds.length){
    const s = scr(modalState.screenId); modalState.reqIds = s.reqs.slice(0, Math.min(3, s.reqs.length)).map(r=>r.id);
  }
  renderModal();
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; modalState=null; }
function setModalKind(k){ modalState.kind=k; if(k==='unit' && modalState.reqIds.length>1) modalState.reqIds=[modalState.reqIds[0]]; renderModal(); }
function toggleModalReq(id){ const a=modalState.reqIds, i=a.indexOf(id);
  if(i>=0){ a.splice(i,1); } else { if(modalState.kind==='unit') modalState.reqIds=[id]; else a.push(id); }
  renderModal();
}
function copyPrompt(){ const ta=document.getElementById('promptTA'); ta.focus(); ta.select();
  const done=()=>toast('Prompt copied — paste it into Claude');
  if(navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(done).catch(()=>{document.execCommand('copy');done();}); }
  else { document.execCommand('copy'); done(); }
}
function buildPrompt(st){
  const s = scr(st.screenId), file = `spec/${st.screenId}/test.spec.ts`;
  if (st.action==='reword'){
    const r = reqOf(st.screenId, st.reqId);
    return `Reword requirement ${r.id} — “${r.title}” — on the “${s.name}” screen (spec/${st.screenId}/prd.md).\n\n`
      + `Current behaviour:\n  Given ${r.given}\n` + beatsOf(r).map(b=>`  When ${b.when}\n  Then ${b.then}`).join('\n') + `\n\n`
      + `What to change:\n  ⟨describe the reword — what it should say instead⟩\n\n`
      + `Requirement ids are stable; don’t renumber. You draft the prose; I own the meaning (CLAUDE.md rule 5). If a test already proves this and the meaning shifts, it will read Changed until re-verified — that’s expected.`;
  }
  if (st.action==='removereq'){
    const r = reqOf(st.screenId, st.reqId);
    return `Remove requirement ${r.id} — “${r.title}” — from the “${s.name}” screen (spec/${st.screenId}/prd.md). It isn’t a real requirement.\n\n`
      + `Delete it from prd.md. Leave the other ids as they are — ids are stable, never renumbered. If any test tagged only ${r.id}, note that the test now covers nothing and ask me whether to drop it too.`;
  }
  if (st.action==='addreq'){
    return `Add a new requirement to the “${s.name}” screen (spec/${st.screenId}/prd.md).\n\n`
      + `What it should say:\n  ⟨the behaviour — Given / When / Then⟩\n\n`
      + `Append it with the next free id (ids are stable, never reused). Ground it in what the screen really does; then it’s canon and ready for a test. You draft the prose; I own the meaning.`;
  }
  if (st.action==='remove'){
    const t = testOf(st.screenId, st.testId), cov = t.covers.join(', '), many = t.covers.length>1;
    return `Remove the ${t.kind} test "${t.name}" from the "${s.name}" screen (${file}).\n\n`
      + `Delete its checkReq block(s) for ${cov}. After removal, ${many?'those requirements':cov} will read UNPROVEN until another test covers ${many?'them':'it'} — that is the honest state, not a regression to paper over.\n\n`
      + `Before deleting: confirm no other requirement was proven ONLY by this test. Never weaken or fake coverage elsewhere to compensate (CLAUDE.md rule 3).`;
  }
  if (st.action==='edit'){
    const t = testOf(st.screenId, st.testId);
    return `Edit the ${t.kind} test "${t.name}" on the "${s.name}" screen (${file}). It currently covers ${t.covers.join(', ')}.\n\n`
      + `What to change:\n  ⟨describe the change — e.g. also assert the empty state, cover one more requirement, tighten a number⟩\n\n`
      + `Rules (kg-e2e / CLAUDE.md):\n`
      + `  • If an assertion now breaks, first decide whether the TEST or the CODE is wrong before editing either (rule 4).\n`
      + `  • Keep every checkReq tag unless a requirement is genuinely no longer covered.\n`
      + `  • Never weaken, skip, or delete an assertion just to go green (rule 3).\n`
      + `  • Every asserted number must be visible in the recording.\n`
      + `  • Don't touch requirement wording — that's mine.`;
  }
  const reqs = st.reqIds.map(id=>reqOf(st.screenId,id)).filter(Boolean);
  const behav = reqs.map(r=>`  ${r.id} — ${r.title}\n     Given ${r.given}${r.sub?` · ${r.sub}`:''}\n` + beatsOf(r).map(b=>`     When ${b.when}\n     Then ${b.then}`).join('\n')).join('\n');
  if (st.kind==='flow'){
    const ids = reqs.map(r=>r.id);
    return `Add a FLOW test that starts on the "${s.name}" screen (${file}) and proves ${ids.join(' → ')||'<pick requirements>'} along one path.\n\n`
      + `Requirements to prove:\n${behav||'  ⟨choose the requirements this flow should reach⟩'}\n\n`
      + `Follow the kg-e2e / kg-deep discipline:\n`
      + `  1. Declare coverage up front: coverReqs(${ids.map(i=>`'${i}'`).join(', ')}) — so an early failure leaves later ones NOT-REACHED, not silently absent.\n`
      + `  2. Write the failing test FIRST and watch it go red.\n`
      + `  3. One checkReq('<id>', …) per requirement, each asserting something that would fail without it.\n`
      + `  4. Cross-screen requirements use qualified tags (e.g. other-screen:R3).\n`
      + `  5. Every asserted number must be VISIBLE in the recording; the writer flow restores its own baseline.\n\n`
      + `Keep requirement ids stable. Don't change any requirement's wording — that's mine.`;
  }
  const r = reqs[0];
  return `Add a UNIT test for the "${s.name}" screen (${file}) that proves ${r?r.id:'<requirement>'}${r?` — ${r.title}`:''}.\n\n`
    + `Behaviour to prove:\n${behav||'  ⟨choose the requirement this test should prove⟩'}\n\n`
    + `Follow the kg-e2e discipline:\n`
    + `  1. Write the failing assertion FIRST and watch it go red.\n`
    + `  2. Tag it: checkReq('${r?r.id:'Rn'}', async () => { … }).\n`
    + `  3. Assert something that would fail WITHOUT this requirement — read the value off the visible UI and assert the exact number (before → after).\n`
    + `  4. Every asserted number must be visible in the recording.\n\n`
    + `Keep requirement ids stable. Don't touch the requirement wording — that's mine.`;
}
function renderModal(){

function coverageReminder(id){
  const s = scr(id);
  const fail    = s.reqs.filter(r=>r.state==='bad').length;
  const nr      = s.reqs.filter(r=>r.state==='nr').length;
  const changed = s.reqs.filter(r=>r.state==='changed').length;
  const un      = s.reqs.filter(r=>r.state==='un').length;
  const gaps = [];
  if (fail)    gaps.push(`<b class="st-bad">${fail} Failed</b>`);
  if (changed) gaps.push(`<b class="st-changed">${changed} Changed</b>`);
  if (nr)      gaps.push(`<b class="st-nr">${nr} Not reached</b>`);
  if (un)      gaps.push(`<b class="st-un">${un} Untested</b>`);
  if (!gaps.length) return '';
  return `<div class="remind"><span class="rk2">${gaps.join('<span style="color:var(--line3)">·</span>')}</span><span class="grow2">— add or revise a test to close the gap. specboard drafts the prompt; Claude writes it.</span><button class="btn" onclick="openPromptModal({action:'add',screenId:'${id}'})">＋ Author a test</button></div>`;
}

function go(h){ location.hash = '#/' + h; }
function route(){
  if (stopScene){ stopScene(); stopScene = null; }
  compStopAll();
  if (typeof closeZoom === 'function') closeZoom();
  const h = location.hash.replace(/^#\/?/, '');
  const c = h.match(/^compose\/([^/]+)$/);
  if (c && SCREENS[c[1]]) return renderCompose(c[1]);
  const m = h.match(/^s\/([^/]+)\/(focus|grid|flow)(?:\/(.+))?$/);
  if (m && SCREENS[m[1]]) renderDetail(m[1], m[2], m[3]);
  else renderHome();
}
window.addEventListener('hashchange', route);
window.addEventListener('keydown', e => {
  const m = location.hash.match(/^#\/s\/([^/]+)\/focus\/(\d+)/);
  if (!m) return;
  const s = scr(m[1]), n = +m[2];
  if (e.key === 'ArrowRight' && n < s.reqs.length) go(`s/${m[1]}/focus/${n+1}`);
  if (e.key === 'ArrowLeft'  && n > 1)             go(`s/${m[1]}/focus/${n-1}`);
});

/* ---- full evidence: steps + logs (R10) ---- */
function buildSteps(id, t, curReqId){
  if (!t) return [];
  const out = [];
  if (t.kind === 'flow'){
    t.chapters.forEach(c => {
      if (c.kind === 'seed'){ out.push({ state:'ok', txt:'fixture — clear storage, pin clock ?now=2026-08-17', dur:'0.1s' }); return; }
      const rid = (c.reqs||[])[0];
      if (c.kind === 'nr'){ out.push({ state:'nr', txt:`proves ${rid} — ${c.name}`, cur:rid===curReqId }); return; }
      out.push({ state:c.fail?'bad':'ok', txt:`proves ${rid} — ${c.name}`, cur:rid===curReqId, dur:'0.'+(3+(rid?rid.length:2))+'s' });
    });
  } else {
    out.push({ state:'ok', txt:`open ${scr(id).route}?now=2026-08-17, wait for data`, dur:'0.4s' });
    out.push({ state:t.result==='fail'?'bad':'ok', txt:`proves ${t.covers[0]} — read the value off screen, assert the exact number`, cur:t.covers[0]===curReqId, dur:'0.3s' });
  }
  return out;
}
function stepsHTML(id, t, curReqId){

  if (!list.length) return `<div class="emptypanel">no test covers this requirement yet — no steps to show.</div>`;
  return `<ol class="steps">${list.map(s => {
    const mk = s.state==='ok'?'✓':s.state==='bad'?'✗':'◌';
    return `<li class="${s.cur?'cur':''}"><span class="sm" style="color:${STATE_COL[s.state]}">${mk}</span><span>${esc(s.txt)}${s.cur?' <span class="curmark">← this requirement</span>':''}</span>${s.dur?`<span class="sd">${s.dur}</span>`:''}</li>`;
  }).join('')}</ol>`;
}
function logsHTML(id, t){
  if (!t) return `<div class="emptypanel">no test covers this requirement yet — nothing to log.</div>`;
  const s = scr(id), L = [];
  L.push(`<span class="ldim">$ npx playwright test -g "${esc(t.name)}"</span>`);
  L.push(`<span class="ldim">Running 1 test using 1 worker</span>`);
  L.push('');
  L.push(`  ${esc(s.name)} › ${esc(t.name)}`);
  L.push(`  <span class="ldim">→</span> page.goto('${s.route}?now=2026-08-17')`);
  buildSteps(id, t).forEach(st => {
    if (st.state === 'nr'){ L.push(`  <span class="ldim">↷ skipped (not reached) — ${esc(st.txt)}</span>`); return; }
    const c = st.state==='bad'?'lbad':'lok', mk = st.state==='bad'?'✗':'✓';

  const counter = `<span style="margin-left:auto;font-size:var(--t-xs);color:var(--mute)">${n} of ${s.reqs.length}</span>`;
  const body = focusBodyHTML(id, n, { selId: focusTestId, counter });
  focusTestId = body.sel ? body.sel.id : null;
  document.getElementById('root').innerHTML = `<div class="wrap">${body.html}
  <div class="pager">${pagerHTML(id,n,s.reqs.length)}</div></div>`;
  if (body.r.scene) mountEvidence(body.r);
}
function pagerHTML(id,n,total){
  let out = `<button ${n===1?'disabled':''} onclick="go('s/${id}/focus/${n-1}')">‹</button>`;
  for (let i=1;i<=total;i++) out += `<button class="${i===n?'cur':''}" onclick="go('s/${id}/focus/${i}')">${i}</button>`;
  out += `<button ${n===total?'disabled':''} onclick="go('s/${id}/focus/${n+1}')">›</button><span class="pk">← → to review one by one</span>`;
  return out;
}

/* ---- GRID ---- */
/* ---- LIST — a list of Focus (human, 2026-08-20): every requirement as a collapsed header row,
   and an open row IS the Focus body, verbatim (focusBodyHTML) — same information, expand/collapse.

let listOpen = null, listTestId = null;
function renderGrid(id){   // router key stays 'grid'; the view label is List

  </div>`;
  if (listOpen){ const r = s.reqs[listOpen-1]; if (r && r.scene) mountEvidence(r, 'evStageL'); }

function toggleList(id, n){

function pickListTest(id, n, tid){ listTestId = tid; listOpen = n; renderGrid(id); }

/* ---- COLUMNS (requirements ↔ tests, many-to-many hover) ---- */

  }).join('') : `<div class="emptypanel" style="height:140px">No tests on this screen yet.${s.guess?' Its requirements are a drafted guess.':''}<br><a href="#" onclick="openPromptModal({action:'add',screenId:'${id}'});return false" style="color:var(--ai)">Author one →</a></div>`;

      <div class="colpane"><div class="colhead">Tests <span class="ch-n">${s.tests.length}</span><span class="colhint">the proof · hover to trace the link</span><button class="btn" style="margin-left:auto;height:28px" onclick="openPromptModal({action:'add',screenId:'${id}'})">＋ Add test</button></div><div class="colbody" id="testCol">${testCol}</div></div>
    </div>
    <p class="legend">Two columns, each scrolling on its own (board R2). Hover a test to light the requirements it proves — or a requirement to light every test that covers it — the many-to-many link (board R5). Coverage is by tag, folded across runs; nothing here is stored.</p>

function wireColumnsHover(){
  const clear = () => document.querySelectorAll('.colreq.hot, .coltest.hot').forEach(e=>e.classList.remove('hot'));
  document.querySelectorAll('#testCol .coltest').forEach(tc => {
    const covers = tc.dataset.covers.split(' ').filter(Boolean);
    tc.addEventListener('mouseenter', () => { tc.classList.add('hot'); covers.forEach(r=>{ const el=document.querySelector(`#reqCol .colreq[data-r="${r}"]`); if(el) el.classList.add('hot'); }); });
    tc.addEventListener('mouseleave', clear);
  });
  document.querySelectorAll('#reqCol .colreq').forEach(rc => {
    const rid = rc.dataset.r;
    rc.addEventListener('mouseenter', () => { rc.classList.add('hot'); document.querySelectorAll('#testCol .coltest').forEach(tc=>{ if(tc.dataset.covers.split(' ').includes(rid)) tc.classList.add('hot'); }); });
    rc.addEventListener('mouseleave', clear);
  });
}

/* ---- FLOW (player) ---- */
function renderFlow(id, flowId){
  const s = scr(id), flows = s.tests.filter(t => t.kind === 'flow');

  }

    <div class="flowcard">

        <span style="position:relative"><button class="linkbtn" onclick="toggleMenu(event,'flowMenu')" aria-label="flow actions">⋯</button>
          <div class="rmenu" id="flowMenu" hidden>
            <button onclick="openPromptModal({action:'edit',screenId:'${id}',testId:'${F.id}'});closeMenus()">✎ Edit this flow</button>
            <button onclick="toast('Would open the full recording');closeMenus()">▶ Open the full recording</button>
            <div class="rmenu-div"></div>
            <button class="danger" onclick="openPromptModal({action:'remove',screenId:'${id}',testId:'${F.id}'});closeMenus()">✕ Remove</button>
          </div></span></div>
      <div class="playwrap">
        <div class="gif" style="margin:0">
          <div class="stagebox"><div class="stage" id="stPlay"></div><div class="stopov" id="stopOv"></div>
            <button class="runone" style="position:absolute;top:8px;right:8px;z-index:5;background:var(--paper);border:1px solid var(--line2);opacity:.92" onclick="playFrom('${id}','${F.id}',0)">⟳ replay</button></div>
        </div>
        <div class="pstat" id="playStatus"></div>
      </div>
      <div class="chstrip" id="chStrip"></div>
    </div>
  </div>`;
  // ONE rail (human 2026-08-21): the chapter strip alone carries the path, its verdicts, and the scrubber
  // chapter strip: the path as CARDS with connectors — beats chained left to right
  let stripFailed = false;
  document.getElementById('chStrip').innerHTML = F.chapters.map((ch,i) => {
    const chips = (ch.reqs||[]).length
      ? ch.reqs.map(rid => { const r = reqOf(id,rid) || crossReq(rid); const st = r?stateOf(r, r.__s||s):'ok'; const [mk]=MK[st];
          return `<a class="mchip ${st}" href="${r&&r.__focus?r.__focus:('#/s/'+id+'/focus/'+((s.reqs.findIndex(x=>x.id===rid))+1))}" style="text-decoration:none">${mk} ${rid}</a>`; }).join('')
      : `<span class="mchip">${ch.kind==='seed'?'fixture':'—'}</span>`;
    const thumb = ch.kind==='nr'
      ? `<div class="noev" style="height:72px;gap:1px;padding:0"><b class="st-nr" style="font-size:11px">◌</b><span class="sub" style="font-size:9px">not reached</span></div>`
      : '';
    const edge = i===0 ? '' : `<div class="edge ${stripFailed?'nrE':''}">→</div>`;
    if (ch.fail) stripFailed = true;
    return edge + `<div class="ch${ch.fail?' fail':''}${ch.kind==='nr'?' nr':''}" data-i="${i}" onclick="if(event.target.tagName!=='A')playFrom('${id}','${F.id}',${i})">
      <div class="thumb" data-ci="${i}" ${(ch.scene||ch.kind==='seed')?`onclick="zoomScene(event,'${ch.kind==='seed'?'sceneSeed':ch.scene}','${esc(ch.name)}')" title="click to zoom"`:''}>${thumb}${cross&&ch.screen?`<span class="scrtag">${esc(ch.screen)}</span>`:''}</div>
      <div class="chname">${esc(ch.name)}</div><div class="chips">${chips}</div></div>`;
  }).join('');
  F.chapters.forEach((ch,i) => {
    const box = document.querySelector(`#chStrip .thumb[data-ci="${i}"]`);
    if (!box) return;
    if (ch.kind === 'seed') mountStill(box, 'sceneSeed', 0.44, 460, 248);
    else if (ch.scene) mountStill(box, ch.scene, 0.44, 460, 248);
  });
  if (autoPlay) playFrom(id, F.id, 0); else pausedFlow(id, F.id);
}
function crossReq(rid){
  for (const sid of SCREEN_ORDER){ const r = reqOf(sid, rid); if (r){ r.__s = scr(sid); r.__focus = `#/s/${sid}/focus/${scr(sid).reqs.findIndex(x=>x.id===rid)+1}`; return r; } }
  return null;
}
function chEls(){ return [...document.querySelectorAll('#chStrip .ch')]; }
function pausedFlow(id, flowId){
  const F = testOf(id, flowId);
  document.getElementById('stopOv').className = 'stopov';
  document.querySelectorAll('.playov').forEach(o=>o.remove());
  const stage = document.getElementById('stPlay'), ch0 = F.chapters[0];
  const sc = ch0.kind==='seed' ? 'sceneSeed' : ch0.scene;
  const ctx = { stage, timers:[], t:0 }; if (sc) SCENE[sc](ctx); ctx.timers.forEach(clearTimeout);
  const c = stage.querySelector('.cur'); if (c) c.remove();
  chEls().forEach((e,i)=>{ e.className='ch'+(F.chapters[i].fail?' fail':'')+(F.chapters[i].kind==='nr'?' nr':''); });
  const box = stage.parentElement;
  const ov = el(`<div class="playov"><button>▶ play the flow</button></div>`);
  ov.querySelector('button').addEventListener('click', ()=>playFrom(id, flowId, 0));
  box.appendChild(ov);
  document.getElementById('playStatus').innerHTML = 'paused — press play, or click any chapter';
}
function playFrom(id, flowId, start){
  const F = testOf(id, flowId);
  if (stopScene){ stopScene(); stopScene = null; }
  document.getElementById('stopOv').className = 'stopov';
  document.querySelectorAll('.playov').forEach(o=>o.remove());
  const stage = document.getElementById('stPlay');
  function setStates(cur){
    chEls().forEach((e,i)=>{ const ch=F.chapters[i];
      e.className = 'ch' + (i<cur?' done':i===cur?' cur':'') + (ch.fail?' fail':'') + (ch.kind==='nr'?' nr':''); });
  }
  function status(i, extra){ document.getElementById('playStatus').innerHTML = `chapter ${i+1} of ${F.chapters.length} — <b style="font-weight:500;color:var(--ink)">${esc(F.chapters[i].name)}</b>${extra?' · '+extra:''}`; }
  function banner(html, kind){ stage.querySelectorAll('.assert').forEach(a=>a.remove()); const ov=document.getElementById('stopOv'); ov.innerHTML=html; ov.className='stopov show '+kind; }
  function runChapter(i){
    if (i >= F.chapters.length) return;
    const ch = F.chapters[i]; setStates(i);
    if (ch.kind === 'nr'){
      stage.innerHTML = `<div class="noev" style="min-height:230px"><b class="st-nr">◌ not reached</b><span class="sub">the flow stopped before this chapter — no evidence for this run</span></div>`;
      status(i, 'not reached'); return;
    }
    const sc = ch.kind==='seed' ? 'sceneSeed' : ch.scene;
    const rid = (ch.reqs||[])[0];
    status(i, rid ? `proves ${rid}` : '');
    stopScene = play(stage, SCENE[sc], { loop:false, onEnd:() => {
      if (ch.fail){
        chEls()[i].className = 'ch fail';
        const nr = F.chapters.findIndex(c=>c.kind==='nr'); if (nr>=0) chEls()[nr].className = 'ch nr';
        banner(`✗ the flow stopped here — ${ch.reqs[0]} failed · everything after is not reached <button class="runone" onclick="playFrom('${id}','${flowId}',0)">⟳ replay</button>`, 'bad');
        return;
      }
      chEls()[i].classList.remove('cur'); chEls()[i].classList.add('done');
      if (i+1 >= F.chapters.length) banner(`✓ flow complete — every tagged requirement proven <button class="runone" onclick="playFrom('${id}','${flowId}',0)">⟳ replay</button>`, 'ok');
      else if (!autoPlay) banner(`chapter done <button class="runone" onclick="playFrom('${id}','${flowId}',${i+1})">▶ play next — ${esc(F.chapters[i+1].name)}</button>`, 'neutral');
      else runChapter(i+1);
    }});
  }
  runChapter(start);
}

/* FLOW COMPOSER — beats are gifs; the chain is a chain of gifs        */
/* (human 2026-08-21: one mockup carries authoring too; visual-first)  */
/* =================================================================== */
/* one node per beat a test already proves — needs → gives are the joint tokens */
const COMPOSE_NODES = [
  { id:'cb-add',   screen:'task-list',   name:'add a task',                          proves:'R1', from:'F2', scene:'sceneR1',           proven:true,  needs:['seeded'],                     gives:['task'] },
  { id:'cb-sub',   screen:'task-list',   name:'add a sub-task — the ring moves',     proves:'R3', from:'U1', scene:'sceneR3',           proven:true,  needs:['seeded'],                     gives:['container','subtask-open'] },
  { id:'cb-roll',  screen:'task-list',   name:'tick the last open sub-task — roll-up', proves:'R4', from:'F1', scene:'sceneR4',         proven:true,  needs:['subtask-open'],               gives:['container-done'] },
  { id:'cb-count', screen:'task-list',   name:'check the remaining count',           proves:'R5', from:'F1', scene:'sceneR5',           proven:true,  needs:['subtask-open'],               gives:['count-checked'] },
  { id:'cb-views', screen:'task-list',   name:'filter to Today — badges agree',      proves:'R6', from:'F2', scene:'sceneR6',           proven:true,  needs:['task'],                       gives:['filtered'] },
  { id:'cb-reload',screen:'task-list',   name:'reload — everything comes back',      proves:'R8', from:'F1', scene:null,                proven:true,  needs:[],                             gives:['reloaded'] },
  { id:'cb-open',  screen:'task-detail', name:'open the container’s detail',         proves:'D1', from:'F3', scene:'sceneOpenDetail',   proven:true,  needs:['container'],                  gives:['detail-open'] },
  { id:'cb-dtick', screen:'task-detail', name:'tick a sub-task from the detail',     proves:'D1', from:'F3', scene:'sceneDetailComplete', proven:true, needs:['detail-open','subtask-open'], gives:['detail-ticked'] },
  { id:'cb-back',  screen:'task-detail', name:'back to the list — it reflects',      proves:'D2', from:'F3', scene:'sceneListReflects', proven:true,  needs:['detail-ticked'],              gives:[] },
  { id:'cb-clear', screen:'settings',    name:'clear data asks to confirm first',    proves:'G2', from:null, scene:null,                proven:false, needs:[],                             gives:['confirm-shown'] },
];
const COMPOSE_START = { given:'frozen clock · storage cleared · seeded', gives:['seeded'] };
let compChain = ['cb-sub','cb-roll'];          // the demo path — valid joints
let compMode  = 'gif';                          // gif ↔ stills — a view preference, never stored
let compQ     = '';                             // the library filter — find a beat fast (human 2026-08-21)
let compTab   = null;                           // the library's screen tab — defaults to the composing screen
let compScreen = null;
let compStops = [];                             // looping thumb players to kill on re-render
function compStopAll(){ compStops.forEach(f=>f()); compStops = [];
  if (typeof libPrevStop !== 'undefined' && libPrevStop){ libPrevStop(); libPrevStop = null; } }
const cnodeOf = id => COMPOSE_NODES.find(n => n.id === id);

function compValidate(){
  let state = new Set(COMPOSE_START.gives), out = [];
  for (const id of compChain){
    const n = cnodeOf(id);
    out.push({ n, missing: n.needs.filter(t => !state.has(t)) });
    n.gives.forEach(t => state.add(t));
  }
  return out;
}
function compFiller(missing){ return COMPOSE_NODES.find(n => n.gives.some(g => missing.includes(g))); }
function compThumb(box, sceneName, scale, w, h){
  if (!sceneName){ box.innerHTML = `<div class="noscene"><span>no scene yet</span><span>drawn on the next viz pass</span></div>`; return; }
  if (compMode === 'gif'){
    const st = document.createElement('div');
    st.className = 'stage short';
    st.style.cssText = `width:${w}px;height:${h}px;transform:scale(${scale});transform-origin:top left;`;
    box.appendChild(st);
    compStops.push(play(st, SCENE[sceneName]));
  } else mountStill(box, sceneName, scale, w, h);
}
function setCompMode(m){ compMode = m; renderCompose(compScreen); }
function compHeader(id){
  const s = scr(id);
  document.getElementById('hdr').innerHTML = `
  <header class="topbar">
    <div class="dname"><span class="t">Flow composer</span><span class="s">${esc(s.name)} · chain proven beats → a ready kg-e2e prompt</span></div>
    <span class="mockflag">mockup</span>
    <div class="grow"></div>
    <div class="seg">
      <button class="${compMode==='gif'?'on':''}" onclick="setCompMode('gif')">gif</button>
      <button class="${compMode==='stills'?'on':''}" onclick="setCompMode('stills')">stills</button>
    </div>
    <button class="btn" onclick="go('s/${id}/flow')">Close</button>
  </header>`;
}
function renderCompose(id){
  compStopAll();
  if (compScreen !== id){   // restore the browser-local draft only on entry, never mid-edit
    try { const d = JSON.parse(localStorage['sbComposeDraft:'+id] || 'null');
      if (Array.isArray(d) && d.length && d.every(x => cnodeOf(x))) compChain = d; } catch(e){}
  }
  compScreen = id;
  compHeader(id);
  const v = compValidate();
  try { localStorage['sbComposeDraft:'+id] = JSON.stringify(compChain); } catch(e){}
  const gap = v.find(x => x.missing.length);
  const filler = gap ? compFiller(gap.missing) : null;
  // what the chain's END provides — the library answers "what can I do next?" with it
  const endState = new Set(COMPOSE_START.gives);
  compChain.forEach(cid => cnodeOf(cid).gives.forEach(t => endState.add(t)));
  const ready = n => n.needs.every(t => endState.has(t));
  // library: search + screen groups (this screen first); ready beats bright and first,
  // blocked beats dimmed with the token they still need; the gap's filler pinned on top
  const q = compQ.trim().toLowerCase();
  const matches = COMPOSE_NODES.filter(n => !q || (n.name+' '+n.proves+' '+scr(n.screen).name).toLowerCase().includes(q));
  const grps = {};
  matches.forEach(n => (grps[n.screen] = grps[n.screen] || []).push(n));
  const order = Object.keys(grps).sort((a,b) => (a===id ? -1 : b===id ? 1 : 0));
  const rowHtml = n => `
      <div class="lrow ${ready(n)?'':'dim'} ${n.proven?'':'outline'} ${filler && filler.id===n.id ? 'hint':''}"
           onclick="compAdd('${n.id}')" onmouseenter="rowPlay(event,'${n.id}')" onmouseleave="rowStill(event,'${n.id}')"
           title="${esc((SCREENS[n.screen].reqs.find(r=>r.id===n.proves)||{}).then || n.name)}">
        <div class="lthumb" data-lt="${n.id}" ${n.scene?`onclick="zoomScene(event,'${n.scene}','${esc(n.name)}')" title="click to zoom"`:''}></div>
        <div class="lmeta2"><div class="lname2">${esc(n.name)}${filler && filler.id===n.id ? ' <b style="color:var(--yamabuki)">← fills the gap</b>' : ''}</div>
          ${ready(n) ? '' : `<div class="lneed">needs ${n.needs.filter(t=>!endState.has(t)).join(' · ')}</div>`}</div>
        <span class="lrid">${n.proves}</span>
      </div>`;
  const lib = `<input class="csearch" id="compQ" placeholder="⌕ find a beat — name or R id" value="${esc(compQ)}"
      oninput="compQ=this.value;renderCompose(compScreen);const i=document.getElementById('compQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)">`
  + (filler ? rowHtml(filler) : '')
  + (matches.length ? order.map(sid =>
      `<div class="cgrp">${esc(scr(sid).name)} · ${grps[sid].length}</div>`
      + grps[sid].filter(n => !filler || n.id !== filler.id)
          .sort((a,b) => (ready(b)?1:0) - (ready(a)?1:0))
          .map(rowHtml).join('')
    ).join('')
    : `<div class="cold2" style="margin-top:8px">no beat matches “${esc(compQ)}”</div>`)

function zoomScene(ev, sceneName, cap){
  ev.stopPropagation();

  const s = Math.max(1.2, Math.min(2.2, ((innerWidth||1280) * .9) / 460, ((innerHeight||800) * .72) / 248));
  const zb = el(`<div class="zoombox"><div class="zstage" style="width:${Math.round(460*s)}px;height:${Math.round(248*s)}px"></div><div class="zcap">${esc(cap||'')} · click or Esc to close</div></div>`);

  if (gapAt >= 0 && cnodeOf(id).gives.some(g => v[gapAt].missing.includes(g))) compChain.splice(gapAt, 0, id);

}

  const covers = [...new Set(compChain.map(id => { const n = cnodeOf(id); return (n.screen===start ? '' : n.screen+':') + n.proves; }))];

`Author a ${new Set(compChain.map(id=>cnodeOf(id).screen)).size>1?'cross-screen ':''}flow test for the "${start}" screen.

File: spec/${start}/test.spec.ts   (a flow lives in the screen it starts on)

${beats || '  (chain beats above)'}

function compHand(){
  const name = (document.getElementById('compName')?.value || 'Untitled flow').trim();
  const start = compChain.length ? cnodeOf(compChain[0]).screen : compScreen;
  compJobTimers.forEach(clearTimeout); compJobTimers = [];
  const j = document.getElementById('compJob'); j.hidden = false;
  const box = j.querySelector('.cjsteps'); box.innerHTML = '';
  const steps = [
    [`prompt handed over · job started detached — Cancel kills the group`, 900],
    [`writing the failing test '${name}' into spec/${start}/test.spec.ts`, 1600],
    [`watched it go RED — every beat's assertion fails without the code ✓`, 1300],
    [`making it pass · one clean run, folded into the index`, 1600],
    [`done — the flow is authored; it appears in the Flow view from its first run`, 0],
  ];
  let t = 0;
  steps.forEach((s, i) => {
    compJobTimers.push(setTimeout(() => {
      box.querySelectorAll('.cjstep.run').forEach(e => { e.classList.remove('run'); e.firstElementChild.textContent = '✓'; });
      box.appendChild(el(`<div class="cjstep ${i < steps.length-1 ? 'run' : ''}"><span>${i < steps.length-1 ? '◌' : '✓'}</span><span>${s[0]}</span></div>`));

  });

function play(stage, build, opts){
  opts = opts || {}; let timers = [], dead = false;
  function cycle(){
    if (dead) return;
    stage.innerHTML = '';
    const ctx = { stage, timers, t:0 };
    const dur = build(ctx);
    if (opts.loop === false) timers.push(setTimeout(()=>{ if(!dead && opts.onEnd) opts.onEnd(); }, dur + 700));
    else timers.push(setTimeout(cycle, dur + 1500));
  }
  cycle();
  return () => { dead = true; timers.forEach(clearTimeout); };
}
function mountStill(box, sceneName, scale, w, h){
  box.querySelectorAll('.stage').forEach(x=>x.remove());
  const st = document.createElement('div');
  st.className = 'stage short';
  st.style.cssText = `width:${w}px;height:${h}px;transform:scale(${scale});transform-origin:top left;`;
  box.appendChild(st);
  const ctx = { stage:st, timers:[], t:0 };
  SCENE[sceneName](ctx);
  ctx.timers.forEach(clearTimeout);
  const c = st.querySelector('.cur'); if (c) c.remove();
  st.querySelectorAll('.assert').forEach(a=>a.remove());
}
function at(ctx, d, fn){ ctx.t += d; ctx.timers.push(setTimeout(fn, ctx.t)); }
function cursor(ctx){
  const c = el(`<div class="cur" style="left:20px;top:20px"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 1 L1 11.5 L4 8.8 L6 13 L8 12 L6 8 L10 8 Z" fill="#1e2330" stroke="#fff" stroke-width="1"/></svg></div>`);
  ctx.stage.appendChild(c); return c;
}
function moveTo(ctx, c, t, dx=4, dy=4){ if(!t) return; const s=ctx.stage.getBoundingClientRect(), r=t.getBoundingClientRect(); c.style.left=(r.left-s.left+r.width/2-dx)+'px'; c.style.top=(r.top-s.top+r.height/2-dy)+'px'; }
function click(c){ c.classList.add('clicking'); setTimeout(()=>c.classList.remove('clicking'),320); }
function typeInto(ctx, field, text, per=45){
  field.classList.add('filled'); field.innerHTML='<span class="caret-i"></span>';
  for (let i=1;i<=text.length;i++) ctx.timers.push(setTimeout(()=>{ field.innerHTML=text.slice(0,i)+'<span class="caret-i"></span>'; }, per*i));
  ctx.timers.push(setTimeout(()=>{ field.textContent=text; }, per*text.length+150));
}
function assertBox(ctx, kind, text, after){ const a=el(`<div class="assert ${kind}">${text}</div>`); ctx.stage.appendChild(a); at(ctx, after||10, ()=>a.classList.add('show')); }

      <div class="trow tdone"><span class="cb on"></span><div class="tb"><div class="ttl2">Sharpen shears</div></div></div>
    </div></div>`;
  const c = cursor(ctx);
  at(ctx,500,()=>moveTo(ctx,c,ctx.stage.querySelector('#vToday')));
  at(ctx,700,()=>{ click(c);
    ctx.stage.querySelector('#vAll').classList.remove('on'); ctx.stage.querySelector('#vToday').classList.add('on');
    ctx.stage.querySelectorAll('#l6 .trow').forEach(r=>{ if(r.dataset.k!=='today') r.style.display='none'; }); });
  assertBox(ctx,'ok','✓ proves R6 — Today badge reads 1 and exactly 1 row is shown',600);
  return ctx.t+1200;
};
