# Browser specs for the viewer's escaping invariant (REQ-KG-VIEW-05). One entry per `test()`, because
# the viewer's Run button targets a case by its exact playwrightTitle.
#
# VIEW-2 and VIEW-3 are deliberately a PAIR: the specs deep-link to these two nodes and inject a
# failure into each — one carrying a suggestedFix, one without — so the "renders it" and "renders
# nothing" halves are asserted against real graph nodes rather than a fixture the viewer never sees.
- id: VIEW-1
  title: A run result renders its error escaped, and its failure screenshot opens
  status: todo
  spec: result-render.spec.ts
  playwrightTitle: "live result event renders an escaped error + clickable failure screenshot"
  verifies: [kg-viewer]
  covers: [REQ-KG-VIEW-05]
  features: [viewer.render]
  exercises: [viewer.template.html]
  steps:
    - action: "Deep-link to the case and click Run, with /api/run mocked to stream a failing result"
      expected: "The error text renders literally — no injected element appears inside it"
      screenshot: view-1-01.png
    - action: "Click the failure screenshot"
      expected: "The lightbox opens showing the run artifact"
      screenshot: view-1-02.png

- id: VIEW-2
  title: A committed failure carrying a suggested fix renders it, escaped and labelled
  status: todo
  spec: suggested-fix.spec.ts
  playwrightTitle: "renders the labelled, esc()'d suggestedFix section only when present"
  verifies: [kg-viewer]
  covers: [REQ-KG-VIEW-05]
  features: [viewer.render]
  exercises: [viewer.template.html]
  steps:
    - action: "Deep-link to a case whose served graph node carries a failure and a suggestedFix"
      expected: "The fix renders under its AI-generated label, as text — no markup becomes DOM"
      screenshot: view-2-01.png

- id: VIEW-3
  title: A committed failure with no suggested fix renders no fix section at all
  status: todo
  spec: suggested-fix.spec.ts
  playwrightTitle: "shows no suggestedFix section when absent"
  verifies: [kg-viewer]
  covers: [REQ-KG-VIEW-05]
  features: [viewer.render]
  exercises: [viewer.template.html]
  steps:
    - action: "Deep-link to a case whose node carries a failure but no suggestedFix"
      expected: "The failure detail shows, and no suggested-fix section is present"
      screenshot: view-3-01.png
