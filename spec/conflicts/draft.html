<!doctype html>
<meta charset="utf-8">
<title>Conflicts</title>
<link rel="stylesheet" href="../_design.css">
<style>
  .hd { display:flex; align-items:baseline; gap:10px; margin-bottom:16px; }
  .hd h1 { font-size:var(--t-xl); }
  .hd .q { font-size:var(--t-md); color:var(--dim); }
  .hd .note { font-size:var(--t-sm); color:var(--acc); margin-left:auto; }
  .cf { background:var(--card); border:1px solid var(--line); border-radius:var(--rc);
    overflow:hidden; margin-bottom:14px; }
  .cf.live { border-color:var(--warn-line); }
  .cf > header { display:flex; align-items:center; gap:var(--s3);
    padding:var(--s3) var(--s4); border-bottom:1px solid var(--line); background:var(--wash); }
  .cf > header .sub { font-size:var(--t-lg); letter-spacing:-.02em; }
  .two { display:grid; grid-template-columns:1fr 1fr; }
  .side { padding:16px 18px; cursor:pointer; }
  .side + .side { border-left:1px solid var(--line); }
  .side.picked { background:var(--acc-bg); }
  .src { display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:var(--t-xs);
    color:var(--mute); margin-bottom:9px; }
  .quote { font-size:var(--t-md); line-height:1.65; color:var(--ink); margin:0 0 10px; }
  .quote b { font-weight:500; background:var(--ai-tint); padding:0 3px; border-radius:var(--r-sm); }
  .ev { font-size:var(--t-xs); color:var(--mute); margin-bottom:12px; }
  .pick { display:flex; align-items:center; gap:9px; font-size:var(--t-sm); color:var(--dim); }
  .side.picked .pick { color:var(--acc); }
  .cfoot { display:flex; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--line); }
  .cfoot .note { flex:1; }
  .imp { font-size:var(--t-xs); color:var(--mute); }
  .settled { background:var(--card); border:1px solid var(--line); border-radius:var(--rc); margin-top:18px; }
  .srow { display:flex; align-items:center; gap:12px; padding:11px 16px; border-top:1px solid var(--line);
    font-size:var(--t-sm); color:var(--dim); }
  .srow:first-of-type { border-top:0; }
  .srow .w { color:var(--ink); }
  .srow .undo { color:var(--mute); }
  .srow .undo:hover { color:var(--ink); border-color:var(--line3); }
</style>

<div class="top">
  <a class="btn sm gh" href="/">← Board</a>
  <div class="brand" style="font-size:14px">Conflicts</div>
  <div class="spacer"></div>
  <div class="seg"><span class="on" id="segopen">Open 2</span><span id="segsettled">Settled 3</span></div>
  <button class="btn sm" id="rescan">Rescan</button>
</div>

<div class="page">
  <div class="hd">
    <h1>One fact, stated two incompatible ways</h1>
    <span class="q">Not gaps or TODOs. Only pairs that cannot both be true.</span>
    <span class="note" id="rescanNote" hidden></span>
  </div>

  <div id="openWrap"></div>

  <div id="nores" class="card pad muted" style="text-align:center;margin-bottom:14px" hidden>Nothing contradicts anything else. Rescan after the next batch of requirements.</div>
  <div class="settled">
    <header style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)">
      <span class="lbl">settled</span>
      <span class="muted" style="font-size:var(--t-sm)">kept by content, so a rescan will not raise them again</span>
    </header>
    <div id="settledRows"></div>
  </div>
</div>

<script>
  // Picking a side is the whole decision this screen exists for, so in the draft it has to be
  // pickable — a radio you cannot click tells you nothing about whether the flow is right.
  // Every conflict is one record so a settled row can be undone back into an open card instead
  // of being a dead end: a resolution you cannot reverse is a decision people avoid making.
  const $ = s => document.querySelector(s)
  const $$ = s => [...document.querySelectorAll(s)]

  const DATA = [
    { id:'c1', status:'open', picked:null, wonAt:null,
      subject:'How many states a board cell can be in',
      importance:'resolving makes 3 screens stale',
      sideA:{ src:'spec/board/prd.md · R4',
        html:'Each cell is missing, waiting, <b>needs-review</b>, stale, or ok. Needs-review means nobody has ever said yes to this; stale means they did and it has since moved.',
        ev:'agrees with tools/build-board.mjs · 1 test' },
      sideB:{ src:'spec/init/prd.md · R3',
        html:'A crawled PRD is marked as a guess. The draft and screen cells stay <b>unapproved</b> so the loop still starts at gate A.',
        ev:'names a sixth state no other document knows' } },
    { id:'c2', status:'open', picked:null, wonAt:null,
      subject:'What opens gate B',
      importance:'resolving makes 1 screen stale',
      sideA:{ src:'spec/gate-screen-review/prd.md · R2',
        html:'The E2E run re-shoots on every pass. If the new screenshot is <b>byte-identical</b> to the approved one, nothing opens.',
        ev:'no test proves this yet' },
      sideB:{ src:'spec/board/prd.md · R4',
        html:'The state is the stored approval hash compared against the <b>current content hash</b> — for the draft, not the screenshot.',
        ev:'agrees with tools/build-board.mjs · 1 test' } },
    { id:'c3', status:'settled', picked:'A', wonAt:'2 days ago',
      subject:'Where the wireframe canvas width is declared',
      importance:'resolving makes 6 screens stale',
      sideA:{ src:'spec/board/prd.md · R2',
        html:'The canvas is <b>1280px</b> wide — the width every draft is authored and scaled against.',
        ev:'agrees with every draft in spec/' },
      sideB:{ src:'spec/init/prd.md · R2',
        html:'The wireframe is generated at <b>1152px</b> to leave room for the crawl sidebar.',
        ev:'no draft in spec/ is authored at this width' } },
    { id:'c4', status:'settled', picked:'A', wonAt:'2 days ago',
      subject:'Whether a row is a screen or a requirement',
      importance:'resolving makes 1 screen stale',
      sideA:{ src:'spec/board/prd.md · R1',
        html:'Each <b>row is one screen</b>; its requirements list inside the card.',
        ev:'agrees with tools/build-board.mjs' },
      sideB:{ src:'spec/dispatch/prd.md · R1',
        html:'Each <b>row is one requirement</b>, grouped under its screen as a header.',
        ev:'no draft in spec/ renders it this way' } },
    { id:'c5', status:'settled', picked:'A', wonAt:'3 days ago',
      subject:'Who takes the screenshot',
      importance:'resolving makes 1 screen stale',
      sideA:{ src:'spec/gate-screen-review/prd.md · R1',
        html:'The <b>E2E run</b> takes the screenshot, on every pass, headless.',
        ev:'agrees with spec/board/test.spec.ts' },
      sideB:{ src:'spec/init/prd.md · R4',
        html:'The CEO takes the screenshot by hand and drops it into the gate.',
        ev:'no test proves this yet' } },
  ]

  function buildCard (item) {
    const cf = document.createElement('div')
    cf.className = 'cf live'
    const loser = item.picked ? (item.picked === 'A' ? item.sideB : item.sideA).src.split(' ·')[0] : null
    cf.innerHTML = `
      <header>
        <span class="chip stale"><span class="dot"></span>open</span>
        <span class="sub">${item.subject}</span>
        <div class="spacer"></div>
        <span class="imp">${item.importance}</span>
      </header>
      <div class="two">
        <div class="side ${item.picked === 'A' ? 'picked' : ''}" data-side="A">
          <div class="src">${item.sideA.src}</div>
          <p class="quote">${item.sideA.html}</p>
          <div class="ev">${item.sideA.ev}</div>
          <div class="pick"><span class="radio ${item.picked === 'A' ? 'on' : ''}"></span>This is canon</div>
        </div>
        <div class="side ${item.picked === 'B' ? 'picked' : ''}" data-side="B">
          <div class="src">${item.sideB.src}</div>
          <p class="quote">${item.sideB.html}</p>
          <div class="ev">${item.sideB.ev}</div>
          <div class="pick"><span class="radio ${item.picked === 'B' ? 'on' : ''}"></span>This is canon</div>
        </div>
      </div>
      <div class="cfoot">
        ${item.picked
          ? `<button class="btn pri" data-resolve>Resolve — rewrite ${loser}</button>`
          : `<button class="btn" disabled style="opacity:.5">Pick a side first</button>`}
        <div class="note"><div class="input ph">Note — carried into the rewrite job</div></div>
      </div>`
    for (const sd of cf.querySelectorAll('.side')) sd.addEventListener('click', () => {
      item.picked = sd.dataset.side
      render()
    })
    const rb = cf.querySelector('[data-resolve]')
    if (rb) rb.addEventListener('click', () => {
      item.status = 'settled'
      item.wonAt = 'just now'
      render()
    })
    return cf
  }

  function buildRow (item) {
    const row = document.createElement('div')
    row.className = 'srow'
    const won = (item.picked === 'A' ? item.sideA : item.sideB).src.split(' ·')[0]
    row.innerHTML = `<span class="chip ok"><span class="dot"></span>settled</span>
      <span class="w">${item.subject}</span><div class="spacer"></div>
      <span class="muted">${won} won · ${item.wonAt}</span>
      <button class="btn sm gh undo" data-undo>Undo</button>`
    row.querySelector('[data-undo]').addEventListener('click', () => {
      item.status = 'open'
      render()
    })
    return row
  }

  function render () {
    const open = DATA.filter(d => d.status === 'open')
    const settled = DATA.filter(d => d.status === 'settled')
    $('#segopen').textContent = 'Open ' + open.length
    $('#segsettled').textContent = 'Settled ' + settled.length

    const wrap = $('#openWrap'); wrap.innerHTML = ''
    for (const item of open) wrap.appendChild(buildCard(item))

    const rows = $('#settledRows'); rows.innerHTML = ''
    for (const item of settled) rows.appendChild(buildRow(item))

    applyTab()
  }

  function applyTab () {
    const onSettled = $('#segsettled').classList.contains('on')
    $('#openWrap').hidden = onSettled
    $('.settled').hidden = !onSettled
    const open = DATA.filter(d => d.status === 'open').length
    $('#nores').hidden = onSettled || open > 0
  }

  for (const s of $$('.top .seg span')) s.addEventListener('click', () => {
    $$('.top .seg span').forEach(x => x.classList.toggle('on', x === s))
    applyTab()
  })

  $('#rescan').addEventListener('click', () => {
    const note = $('#rescanNote')
    const settled = DATA.filter(d => d.status === 'settled').length
    note.hidden = false
    note.textContent = 'Rescanned just now — 0 new · ' + settled + ' settled decision' + (settled === 1 ? '' : 's') + ' kept by content'
  })

  render()
</script>
